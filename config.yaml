# ===== FORMAT =====
# "compilation" = 1 Video mit den Top-5-Momenten (#5 -> #1) pro Lauf  <- aktiv
# "single"      = einzelne Clips (3 zur Auswahl pro Lauf, altes Verhalten)
mode: "compilation"

compilation:
  moments: 5                 # so viele Momente pro Video
  min_moments: 3             # weniger gefunden -> kein Video
  moment_max_seconds: 15     # Länge pro Moment (um den Höhepunkt herum)
  max_per_streamer: 2        # max. Momente desselben Streamers in einem Video
  teaser_seconds: 2.0        # Vorschau auf #1 ganz am Anfang
  game_keyword: "GTA 6"
  teaser_title: "TOP {n} {game} MOMENTE HEUTE – WARTET AUF #1"
  caption_openers:
    - "Die {game} Momente des Tages 😳 Wartet auf #1…"
    - "Top 5 {game} Momente von heute 💀"
    - "Das ist heute in {game} passiert 😭"
    - "Die krassesten {game} Clips von heute – #1 ist unfassbar 🤯"
    - "Deutsche Streamer vs. {game} – die Top 5 von heute 🔥"
  caption_ctas:
    - "Welcher war euer Favorit? 👇"
    - "Wer hätte Platz 1 verdient? 👇"
    - "Schreibt eure Nummer in die Kommentare 👇"
    - "Folgen für jeden Tag die besten Momente 🎬"
    - "Falsche Reihenfolge? Diskutiert 👇"
  max_hashtags: 6
  hashtags_core: ["#gta6"]
  hashtags_pool: ["#gtavi", "#gta6deutsch", "#gta6clips", "#twitchclips", "#vicecity", "#gaming", "#fürdich"]

# ============================================================
#  TikTok Auto-Clipper – Einstellungen
#  Alles hier kannst du direkt auf GitHub im Browser bearbeiten.
# ============================================================

# ===== TESTWOCHE: Fokus deutsche Top-Streamer =====

# Fokus-Spiele: deren Top-Clips werden immer mit durchsucht und bekommen einen Bonus.
# Diese Woche: KEIN Spiele-Fokus -> alles, was viral geht (Just Chatting, FIFA/FC, IRL, Gaming …).
# Ab GTA-Start (Do.) einfach wieder eintragen:
#   - "Grand Theft Auto VI"
games:
  - "Grand Theft Auto VI"
game_bonus: 4            # GTA-Release: GTA-Clips zählen 4x -> fast immer vorne
only_focus_games: true   # GTA-Release: AUSSCHLIESSLICH GTA VI

# Große deutsche Streamer (Twitch-Login, klein). Deren Top-Clips werden jeden Lauf geprüft.
# Unbekannte Namen werden einfach ignoriert. Liste beliebig erweitern/kürzen.
# Top-Format: NUR Clips von diesen Streamern verwenden.
only_top_streamers: true

top_streamers:
  - montanablack88
  - papaplatte
  - trymacs
  - eliasn97
  - rewinside
  - handofblood
  - knossi
  - reved
  - sidneyeweka
  - inscope21
  - unsympathischtv
  - gronkh
  - zarbex
  - rumathra
  - noway4u_sir
  - stegi
  - xrohat
  - bastighg
  - herrbergmann
  - mckytv
  - staiy
  - amar
  - letshugotv
  - shurjoke
  - dhalucard
  - tanzverbot

# Zusätzlich: die N deutschsprachigen Streams, die GERADE live die meisten Zuschauer haben.
live_top_n: 0             # Top-Format: keine Zufalls-Streams, nur die Liste oben

# Optional: NUR diese Streamer (überschreibt alles oben). Leer = aus.
streamers_allowlist: []

# Diese Streamer werden NIE gepostet (z. B. wenn jemand Clipping verbietet).
streamers_blocklist: []

# Sprachen der Clips (Twitch-Streamsprache).
languages: ["de"]

# Nur Clips, die NACH diesem Zeitpunkt entstanden sind (leer = aus).
not_before: ""

# Wie weit zurück nach Clips gesucht wird (Stunden).
lookback_hours: 24

# Mindestaufrufe, damit ein Clip als "viral" gilt.
min_views: 100

# Clip-Länge der Twitch-Clips, die überhaupt infrage kommen (Sekunden).
min_duration: 8
max_duration: 60

# Schnitt fürs fertige Video:
max_output_seconds: 40   # länger wird um den Höhepunkt herum gekürzt (15-35 s laufen am besten)
max_start_trim: 4        # so viele Sekunden Leerlauf am Anfang dürfen max. weg

# Postzeitpunkte (deutsche Zeit). Zu diesen Uhrzeiten kommen neue Clips.
post_hours: [13, 19]     # 2 Top-Videos pro Tag

# Wie viele Clips pro Lauf geschickt werden (zur Auswahl, je ein anderer Streamer).
# Du postest davon nur den stärksten.
clips_per_run: 3

# Maximal so viele Clips pro Streamer innerhalb von 24h (Abwechslung).
max_per_streamer_per_day: 4

# TikTok-Modus:
#   "manual" = Video + Beschreibung kommen per Push (ntfy) aufs Handy, du lädst selbst hoch.
#              Braucht KEINE TikTok-Developer-App.  <- aktuell aktiv
#   "inbox"  = Clip landet als Entwurf in deiner TikTok-App -> du tippst auf Posten
#              (funktioniert sofort, ohne TikTok-App-Prüfung)
#   "direct" = wird direkt veröffentlicht (öffentlich erst nach TikTok-App-Prüfung)
tiktok_mode: "manual"

# Sichtbarkeit bei "direct": PUBLIC_TO_EVERYONE (nach Prüfung) oder SELF_ONLY (vor Prüfung)
privacy_level: "SELF_ONLY"

# Split-Layout: Facecam des Streamers wird automatisch erkannt -> groß oben, Gameplay unten.
# Ohne erkannte Facecam: Standard-Layout (Video mittig, unscharfer Hintergrund).
split_layout: true

# Automatische Untertitel (Whisper). Modell: tiny / base / small (small = besser, langsamer)
captions: true
whisper_model: "medium"   # medium = deutlich besser bei deutschem Slang

# ---------- BESCHREIBUNG ----------
# Hooks: pro Clip wird zufällig einer gewählt (Abwechslung = weniger "Spam"-Signal).
hooks:
  de:
    - "Er hat NICHT damit gerechnet 💀"
    - "Wartet bis zum Ende 😭"
    - "Das ist gerade wirklich live passiert 😳"
    - "Chat ist komplett eskaliert 💀"
    - "Niemand war darauf vorbereitet 😂"
    - "Bester Moment des Streams 🔥"
    - "Ich kann nicht mehr 😭😭"
    - "Wie ist das bitte live passiert?! 💀"
    - "Er wusste sofort, dass es vorbei ist 😂"
    - "Das Ende… 😳"
    - "Bro hat einfach komplett verloren 💀"
    - "Kein Mensch hat das kommen sehen 😂"
  en:
    - "He did NOT see that coming 💀"
    - "Wait for the end 😭"
    - "This actually just happened 😂"

# ---------- BESCHREIBUNGEN (abwechslungsreich, aus dem echten Clip) ----------
# Pro Clip wird zufällig kombiniert – und nichts wiederholt, was kürzlich dran war.
# Platzhalter in "structures": {hook} {title} {quote} {streamer} {cta} {e} {game}
#   {quote} = bester gesprochener Satz aus dem Clip, {title} = Clip-Titel
caption_engine:
  structures:
    - "{hook}\n{title} {e}\n{cta}"
    - "„{quote}“ {e}\n{streamer} hat es nicht kommen sehen\n{cta}"
    - "{title} {e}\n{cta}"
    - "POV: {title} {e}\n{cta}"
    - "{hook}\n„{quote}“\n{cta}"
    - "„{quote}“ – {streamer} {e}\n{hook}"
    - "{streamer} in {game}: {title} {e}\n{cta}"
    - "{hook}\n{cta}"
  hooks:
    - "Er hat NICHT damit gerechnet"
    - "Wartet bis zum Ende"
    - "Das ist gerade wirklich live passiert"
    - "Chat ist komplett eskaliert"
    - "Kein Mensch war darauf vorbereitet"
    - "Ich kann nicht mehr"
    - "Wie ist das bitte live passiert?!"
    - "Er wusste sofort, dass es vorbei ist"
    - "Das Ende…"
    - "Bro hat einfach komplett verloren"
    - "Achtet auf sein Gesicht"
    - "Das Timing war einfach perfekt"
    - "Das kann man sich nicht ausdenken"
    - "So schnell kann's gehen"
    - "Er hat es selbst nicht geglaubt"
  ctas:
    - "Hättest du's besser gemacht? 👇"
    - "Ehrlich: 1–10? 👇"
    - "Markier jemanden, der genau so spielt 😂"
    - "Was hättest du gemacht? 👇"
    - "Wer kennt's? 🙋‍♂️"
    - "Schreib's in die Kommentare 👇"
    - "Fail oder Skill? 👇"
    - "Folgen für mehr davon 🎬"
    - "Teil das mit deinem Squad 😂"
    - "Wer hat's live gesehen? 👀"
  emojis: ["💀", "😭", "😂", "😳", "🔥", "🤯", "😮‍💨", "🫠"]
  keyword_lines:
    - "{streamer} {game} Clip deutsch"
    - "{game} deutsch – {streamer} Twitch Highlight"
    - "{streamer} Twitch Clip | {game}"
  max_hashtags: 5
  hashtags_core: ["#twitchclips"]
  hashtags_pool: ["#twitchdeutschland", "#fürdich", "#fyp", "#streamer", "#lustig", "#gaming"]
  games:
    "Grand Theft Auto VI":
      keyword: "GTA 6"
      hashtags_core: ["#gta6"]
      hashtags_pool: ["#gtavi", "#gta6deutsch", "#gta6clips", "#vicecity", "#gaming", "#fürdich", "#twitchclips"]
      hooks:
        - "GTA 6 ist einfach krank"
        - "Die GTA 6 Polizei kennt keine Gnade"
        - "Vice City hat ihn komplett zerstört"
        - "Nur in GTA 6 passiert sowas"
        - "GTA 6 Physik ist nicht von dieser Welt"
        - "Niemand hat mit DIESEM GTA 6 Moment gerechnet"
        - "So eskaliert GTA 6 in 10 Sekunden"
        - "Rockstar, was habt ihr da gebaut?!"

# Vorlagen pro Sprache. Platzhalter:
#   {hook} {title} {streamer} {streamer_tag} {game} {game_tag}
# {title} = Twitch-Clip-Titel, oder – falls der Müll ist ("KEKW") – der erste gesprochene Satz.
# Zeilenumbrüche bleiben erhalten. Wenige Hashtags + Suchbegriffe als Text = besser für die TikTok-Suche.
caption_templates:
  de: |
    {hook} {title}
    {streamer} Twitch Clip deutsch | {game}
    #{streamer_tag} #twitchdeutschland #twitchclips #fürdich
  en: |
    {hook} {title}
    {streamer} Twitch clip | {game}
    #{streamer_tag} #twitchclips #fyp

# ---------- THUMBNAIL ----------
# Wird automatisch gewählt: der lauteste Moment im Clip (= meist der Höhepunkt).
# Der Hook-Titel ist oben ins Video eingebrannt, also auch auf dem Thumbnail sichtbar.
