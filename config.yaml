# ============================================================
#  TikTok Auto-Clipper – Einstellungen
#  Alles hier kannst du direkt auf GitHub im Browser bearbeiten.
# ============================================================

# ===== TESTWOCHE: Fokus deutsche Top-Streamer =====

# Fokus-Spiele: deren Top-Clips werden immer mit durchsucht und bekommen einen Bonus.
games:
  - "Grand Theft Auto VI"
  - "Grand Theft Auto V"
game_bonus: 1.5          # GTA-Clips zählen 1,5x so viel beim Ranking
only_focus_games: false  # true = NUR GTA-Clips, false = alle Kategorien der Top-Streamer

# Große deutsche Streamer (Twitch-Login, klein). Deren Top-Clips werden jeden Lauf geprüft.
# Unbekannte Namen werden einfach ignoriert. Liste beliebig erweitern/kürzen.
top_streamers:
  - montanablack88
  - papaplatte
  - trymacs
  - eliasn97
  - rewinside
  - handofblood
  - knossi
  - reved
  - sidneyeweka
  - inscope21
  - unsympathischtv
  - gronkh
  - zarbex
  - rumathra
  - noway4u_sir
  - stegi
  - mckytv
  - staiy
  - amar
  - letshugotv
  - shurjoke
  - dhalucard
  - tanzverbot

# Zusätzlich: die N deutschsprachigen Streams, die GERADE live die meisten Zuschauer haben.
live_top_n: 25

# Optional: NUR diese Streamer (überschreibt alles oben). Leer = aus.
streamers_allowlist: []

# Diese Streamer werden NIE gepostet (z. B. wenn jemand Clipping verbietet).
streamers_blocklist: []

# Sprachen der Clips (Twitch-Streamsprache).
languages: ["de"]

# Wie weit zurück nach Clips gesucht wird (Stunden).
lookback_hours: 24

# Mindestaufrufe, damit ein Clip als "viral" gilt.
min_views: 200

# Clip-Länge in Sekunden (TikTok: zu kurz = wenig Watchtime).
min_duration: 8
max_duration: 60

# Wie viele Clips pro Lauf gepostet werden.
clips_per_run: 1

# Maximal so viele Clips pro Streamer innerhalb von 24h (Abwechslung).
max_per_streamer_per_day: 2

# TikTok-Modus:
#   "manual" = Video + Beschreibung kommen per Push (ntfy) aufs Handy, du lädst selbst hoch.
#              Braucht KEINE TikTok-Developer-App.  <- aktuell aktiv
#   "inbox"  = Clip landet als Entwurf in deiner TikTok-App -> du tippst auf Posten
#              (funktioniert sofort, ohne TikTok-App-Prüfung)
#   "direct" = wird direkt veröffentlicht (öffentlich erst nach TikTok-App-Prüfung)
tiktok_mode: "manual"

# Sichtbarkeit bei "direct": PUBLIC_TO_EVERYONE (nach Prüfung) oder SELF_ONLY (vor Prüfung)
privacy_level: "SELF_ONLY"

# Automatische Untertitel (Whisper). Modell: tiny / base / small (small = besser, langsamer)
captions: true
whisper_model: "medium"   # medium = deutlich besser bei deutschem Slang

# ---------- BESCHREIBUNG ----------
# Hooks: pro Clip wird zufällig einer gewählt (Abwechslung = weniger "Spam"-Signal).
hooks:
  de:
    - "Er hat NICHT damit gerechnet 💀"
    - "Wartet bis zum Ende 😭"
    - "Das ist gerade wirklich live passiert 😳"
    - "Chat ist komplett eskaliert 💀"
    - "Niemand war darauf vorbereitet 😂"
    - "Bester Moment des Streams 🔥"
    - "Ich kann nicht mehr 😭😭"
    - "Wie ist das bitte live passiert?! 💀"
    - "Er wusste sofort, dass es vorbei ist 😂"
    - "Das Ende… 😳"
    - "Bro hat einfach komplett verloren 💀"
    - "Kein Mensch hat das kommen sehen 😂"
  en:
    - "He did NOT see that coming 💀"
    - "Wait for the end 😭"
    - "This actually just happened 😂"

# Vorlagen pro Sprache. Platzhalter:
#   {hook} {title} {streamer} {streamer_tag} {game_tag}
# {title} = Twitch-Clip-Titel, oder – falls der Müll ist ("KEKW") – der erste gesprochene Satz.
caption_templates:
  de: "{hook} {title} | 🎥 twitch.tv/{streamer} #{streamer_tag} #{game_tag} #twitchclips #twitchdeutschland #streamer #fürdich #fyp #deutsch #lustig"
  en: "{hook} {title} | 🎥 twitch.tv/{streamer} #{streamer_tag} #{game_tag} #gta6 #twitch #twitchclips #fyp #viral"

# ---------- THUMBNAIL ----------
# Wird automatisch gewählt: der lauteste Moment im Clip (= meist der Höhepunkt).
# Der Hook-Titel ist oben ins Video eingebrannt, also auch auf dem Thumbnail sichtbar.
