name: TikTok verbinden (einmalig)

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code von der Callback-Seite"
        required: true

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Code gegen Token tauschen
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_AUTH_CODE: ${{ inputs.code }}
          TIKTOK_REDIRECT_URI: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/callback.html
        run: python -m clipper.auth
      - name: Token als Secret speichern
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set TIKTOK_REFRESH_TOKEN < .new_refresh_token && rm .new_refresh_token
