name: TikTok Clipper

on:
  schedule:
    # Alle 20 Minuten kurz anklopfen (GitHub lässt geplante Läufe oft ausfallen).
    # Ob wirklich ein Lauf fällig ist, entscheidet der "gate"-Job anhand von
    # post_hours in config.yaml (deutsche Zeit). Nachts passiert nichts.
    - cron: "7,27,47 8-22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Video erstellen (nicht posten)"
        type: boolean
        default: false
      gated:
        description: "Nur laufen, wenn ein Postzeitpunkt fällig ist (für externe Wecker)"
        type: boolean
        default: false

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            clipper
            state
            config.yaml
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.gated }}" != "true" ]; then
            echo "Per Hand gestartet – läuft immer."; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            pip install -q pyyaml && python -m clipper.gate
          fi

  clip:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg + Schrift installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Whisper-Modell cachen
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/piper-voices
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-

      - name: Clipper starten
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m clipper.run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Bisherige Clips der Seite laden
        uses: actions/cache/restore@v4
        with:
          path: site/clips
          key: site-${{ github.run_id }}
          restore-keys: site-

      - name: Clip-Seite bauen
        run: |
          mkdir -p site/clips
          [ -f site/clips/clips.json ] && mv site/clips/clips.json site/clips.json || true
          cp -r docs/. site/
          python -m clipper.publish site site
          cp site/clips.json site/clips/clips.json

      - name: Clips für den nächsten Lauf merken
        uses: actions/cache/save@v4
        with:
          path: site/clips
          key: site-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Clip-Seite veröffentlichen
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Kurz warten (GitHub-Störung?)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - name: Clip-Seite veröffentlichen (2. Versuch)
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Push aufs Handy
        if: ${{ !cancelled() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m clipper.publish notify

      - name: Neuen TikTok-Refresh-Token speichern
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set TIKTOK_REFRESH_TOKEN < .new_refresh_token && rm .new_refresh_token

      - name: Fertige Videos als Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            output/*.mp4
            output/*.jpg
          if-no-files-found: ignore
          retention-days: 3

      - name: Gepostete Clips merken
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "state: gepostete Clips"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
