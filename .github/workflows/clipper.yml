name: TikTok Clipper

on:
  schedule:
    # 6 Läufe am Tag zu den besten Zeiten (deutsche Winterzeit = UTC+1):
    # 11:17, 13:17, 15:17, 17:17, 19:17, 21:17 Uhr. Nachts Pause.
    - cron: "17 10-20/2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Video erstellen (nicht posten) – Ergebnis unter 'Artifacts'"
        type: boolean
        default: false

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg + Schrift installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Whisper-Modell cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-

      - name: Clipper starten
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m clipper.run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Bisherige Clips der Seite laden
        uses: actions/cache/restore@v4
        with:
          path: site/clips
          key: site-${{ github.run_id }}
          restore-keys: site-

      - name: Clip-Seite bauen
        run: |
          mkdir -p site/clips
          [ -f site/clips/clips.json ] && mv site/clips/clips.json site/clips.json || true
          cp -r docs/. site/
          python -m clipper.publish site site
          cp site/clips.json site/clips/clips.json

      - name: Clips für den nächsten Lauf merken
        uses: actions/cache/save@v4
        with:
          path: site/clips
          key: site-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Clip-Seite veröffentlichen
        uses: actions/deploy-pages@v4

      - name: Push aufs Handy
        if: ${{ !cancelled() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m clipper.publish notify

      - name: Neuen TikTok-Refresh-Token speichern
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set TIKTOK_REFRESH_TOKEN < .new_refresh_token && rm .new_refresh_token

      - name: Fertige Videos als Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: |
            output/*.mp4
            output/*.jpg
          if-no-files-found: ignore
          retention-days: 3

      - name: Gepostete Clips merken
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "state: gepostete Clips"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
