name: TikTok Clipper

on:
  schedule:
    - cron: "17 */2 * * *"   # alle 2 Stunden (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Video erstellen (nicht posten) – Ergebnis unter 'Artifacts'"
        type: boolean
        default: false

concurrency:
  group: clipper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ffmpeg + Schrift installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Whisper-Modell cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-

      - name: Clipper starten
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: python -m clipper.run ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Neuen TikTok-Refresh-Token speichern
        if: always() && hashFiles('.new_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set TIKTOK_REFRESH_TOKEN < .new_refresh_token && rm .new_refresh_token

      - name: Fertige Videos als Download bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Gepostete Clips merken
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state: gepostete Clips" && git push)
