<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok verbunden</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; padding: 24px; max-width: 560px; margin: auto; }
  code { display: block; word-break: break-all; background: #222; padding: 14px; border-radius: 8px; margin: 12px 0; font-size: 15px; }
  button { font-size: 18px; padding: 12px 20px; border-radius: 8px; border: 0; background: #fe2c55; color: #fff; width: 100%; }
</style>
</head>
<body>
<h1>Fast geschafft ✅</h1>
<p id="msg">Kopiere diesen Code und füge ihn im GitHub-Workflow <b>„TikTok verbinden (einmalig)"</b> ein:</p>
<code id="code">–</code>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent);this.textContent='Kopiert!'">Code kopieren</button>
<script>
  const p = new URLSearchParams(location.search);
  const c = p.get('code');
  if (c) document.getElementById('code').textContent = c;
  else document.getElementById('msg').textContent = 'Kein Code gefunden: ' + (p.get('error_description') || p.get('error') || 'bitte erneut verbinden.');
</script>
</body>
</html>
